version: "3.9"

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      # Read-only allowlist for Traefik swarm provider (POST stays denied by default)
      CONTAINERS: "1"
      NETWORKS: "1"
      NODES: "1"
      SERVICES: "1"
      TASKS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-socket
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        cloud.subtract.application: "traefik"
        cloud.subtract.environment: "production"
        cloud.subtract.managed-by: "doco-cd"
        cloud.subtract.provisioning-source: "git"
        cloud.subtract.role: "socket-proxy"

  traefik:
    image: traefik:v3.6.6
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=tcp://socket-proxy:2375
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik-public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.ping.address=:8082
      - --ping=true
      - --ping.entrypoint=ping
      - --api.dashboard=false
      - --log.level=INFO
      # - --accesslog=true
      # - --accesslog.format=common
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    networks:
      - traefik-public
      - traefik-socket
    healthcheck:
      # CLI defaults to :8080; must match the ping entrypoint above
      test:
        [
          "CMD",
          "traefik",
          "healthcheck",
          "--ping",
          "--ping.entrypoint=ping",
          "--entrypoints.ping.address=:8082",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        cloud.subtract.application: "traefik"
        cloud.subtract.environment: "production"
        cloud.subtract.managed-by: "doco-cd"
        cloud.subtract.provisioning-source: "git"
        cloud.subtract.role: "ingress"

networks:
  traefik-public:
    name: traefik-public
    driver: overlay
    attachable: true
    labels:
      cloud.subtract.application: "traefik"
      cloud.subtract.role: "ingress"
  traefik-socket:
    name: traefik-socket
    driver: overlay
    internal: true
    labels:
      cloud.subtract.application: "traefik"
      cloud.subtract.role: "socket-proxy"
