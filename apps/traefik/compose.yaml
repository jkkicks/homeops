version: "3.9"

services:
  traefik:
    image: traefik:v3.6.6
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik-public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.ping.address=:8082
      - --ping=true
      - --ping.entrypoint=ping
      - --api.dashboard=false
      - --log.level=INFO
      # - --accesslog=true
      # - --accesslog.format=common
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        cloud.subtract.application: "traefik"
        cloud.subtract.environment: "production"
        cloud.subtract.managed-by: "doco-cd"
        cloud.subtract.provisioning-source: "git"
        cloud.subtract.role: "ingress"

networks:
  traefik-public:
    name: traefik-public
    driver: overlay
    attachable: true
    labels:
      cloud.subtract.application: "traefik"
      cloud.subtract.role: "ingress"
