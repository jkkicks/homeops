version: "3.9"

services:
  traefik:
    image: traefik:v3.4
    command:
      # Traefik v3: Swarm is its own provider (docker.swarmMode was removed)
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik-public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        cloud.subtract.application: "traefik"
        cloud.subtract.environment: "production"
        cloud.subtract.managed-by: "doco-cd"
        cloud.subtract.provisioning-source: "git"
        cloud.subtract.role: "ingress"

networks:
  traefik-public:
    name: traefik-public
    driver: overlay
    attachable: true
    labels:
      cloud.subtract.application: "traefik"
      cloud.subtract.role: "ingress"
