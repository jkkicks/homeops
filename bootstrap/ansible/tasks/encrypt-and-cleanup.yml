---
- name: Check staged Git access token for retention
  ansible.builtin.stat:
    path: "{{ doco_cd_git_token_file }}"
  register: staged_git_access_token
  no_log: true

- name: Encrypt Git access token with SOPS
  ansible.builtin.command:
    argv:
      - sops
      - encrypt
      - --input-type
      - binary
      - --output-type
      - yaml
      - --output
      - "{{ doco_cd_git_token_sops_file }}"
      - "{{ doco_cd_git_token_file }}"
  when: staged_git_access_token.stat.exists
  no_log: true

- name: Check retained Git access token ciphertext
  ansible.builtin.stat:
    path: "{{ doco_cd_git_token_sops_file }}"
  register: retained_git_access_token
  no_log: true

- name: Require retained Git access token ciphertext
  ansible.builtin.assert:
    that:
      - retained_git_access_token.stat.exists
    fail_msg: >-
      Refusing plaintext cleanup because the Git access token ciphertext is
      missing.
  no_log: true

- name: Stage Git access token ciphertext
  ansible.builtin.command:
    argv:
      - git
      - add
      - --
      - bootstrap/ansible/secrets/git_access_token.sops.yml
  args:
    chdir: "{{ playbook_dir }}/../../.."
  changed_when: false
  no_log: true

- name: Check staged Git access token ciphertext
  ansible.builtin.command:
    argv:
      - git
      - diff
      - --cached
      - --quiet
      - --
      - bootstrap/ansible/secrets/git_access_token.sops.yml
  args:
    chdir: "{{ playbook_dir }}/../../.."
  register: staged_git_access_token_commit
  changed_when: false
  failed_when: staged_git_access_token_commit.rc not in [0, 1]

- name: Commit Git access token ciphertext
  ansible.builtin.command:
    argv:
      - git
      - commit
      - -m
      - "chore: retain encrypted Git access token"
      - --only
      - --
      - bootstrap/ansible/secrets/git_access_token.sops.yml
  args:
    chdir: "{{ playbook_dir }}/../../.."
  when: staged_git_access_token_commit.rc == 1
  changed_when: true

- name: Verify Git access token ciphertext is committed
  ansible.builtin.command:
    argv:
      - git
      - diff
      - --quiet
      - HEAD
      - --
      - bootstrap/ansible/secrets/git_access_token.sops.yml
  args:
    chdir: "{{ playbook_dir }}/../../.."
  register: committed_git_access_token
  changed_when: false
  failed_when: committed_git_access_token.rc not in [0, 1]

- name: Require committed Git access token ciphertext
  ansible.builtin.assert:
    that:
      - committed_git_access_token.rc == 0
    fail_msg: >-
      Refusing plaintext cleanup because the Git access token ciphertext is
      not committed.
  no_log: true

- name: Delete bootstrap-window plaintext
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../../{{ item }}"
    state: absent
  loop:
    - git_access_token.txt
    - netbird_setup_key.txt
    - sops_age_key.txt
    - bootstrap_ssh_private_key
    - bootstrap_ssh_password.txt
  no_log: true
