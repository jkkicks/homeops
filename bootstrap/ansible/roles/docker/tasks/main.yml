---
- name: Require Ubuntu 24.04 for Docker
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version == "24.04"
    fail_msg: "The Docker role supports Ubuntu 24.04 only."

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure official Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  vars:
    docker_apt_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}

- name: Install pinned Docker Engine packages
  ansible.builtin.apt:
    name: "{{ item.name }}={{ item.version }}"
    state: present
    update_cache: true
    allow_downgrade: true
    allow_change_held_packages: true
  loop: "{{ docker_packages }}"
  loop_control:
    label: "{{ item.name }}={{ item.version }}"
  notify: Restart Docker

- name: Hold pinned Docker Engine packages
  ansible.builtin.dpkg_selections:
    name: "{{ item.name }}"
    selection: hold
  loop: "{{ docker_packages }}"
  loop_control:
    label: "{{ item.name }}"

# community.docker modules import these on the managed host's Python interpreter
# (docker SDK for swarm/secret; jsondiff for docker_stack).
- name: Install community.docker Python dependencies
  ansible.builtin.apt:
    name:
      - python3-docker
      - python3-jsondiff
    state: present

- name: Configure conservative Docker daemon policy
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    # live-restore is intentionally omitted: Docker rejects Swarm init when it is enabled.
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-file": "3",
          "max-size": "10m"
        }
      }
  notify: Restart Docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
