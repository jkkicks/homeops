---
- name: Set inventory-defined hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"

- name: Set system timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install Netbird repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Netbird repository signing key
  ansible.builtin.get_url:
    url: https://pkgs.netbird.io/debian/public.key
    dest: /usr/share/keyrings/netbird.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Netbird apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/netbird.asc]
      https://pkgs.netbird.io/debian stable main
    filename: netbird
    state: present

- name: Install Netbird agent
  ansible.builtin.apt:
    name: netbird
    state: present
    update_cache: true

- name: Enable Netbird service
  ansible.builtin.systemd_service:
    name: netbird
    enabled: true
    state: started

- name: Check Netbird connection
  ansible.builtin.command:
    cmd: netbird status -C ready
  register: netbird_status
  changed_when: false
  failed_when: false

- name: Check staged Netbird setup key
  ansible.builtin.stat:
    path: "{{ netbird_setup_key_file }}"
  delegate_to: localhost
  become: false
  register: netbird_setup_key
  when: netbird_status.rc != 0
  no_log: true

- name: Require staged Netbird setup key
  ansible.builtin.assert:
    that:
      - netbird_setup_key.stat.exists
      - netbird_setup_key.stat.isreg
    fail_msg: "Stage netbird_setup_key.txt at the repository root before enrollment."
  when: netbird_status.rc != 0
  no_log: true

- name: Enroll Netbird peer
  ansible.builtin.command:
    argv:
      - netbird
      - up
      - --setup-key
      - "{{ lookup('ansible.builtin.file', netbird_setup_key_file) | trim }}"
  changed_when: true
  when: netbird_status.rc != 0
  no_log: true

- name: Wait for Netbird readiness
  ansible.builtin.command:
    cmd: netbird status -C ready
  register: netbird_ready
  changed_when: false
  retries: 12
  delay: 5
  until: netbird_ready.rc == 0

- name: Discover Netbird IPv4 address
  ansible.builtin.command:
    cmd: netbird status --ipv4
  register: netbird_ipv4
  changed_when: false

- name: Record Netbird IPv4 address
  ansible.builtin.set_fact:
    netbird_ip: "{{ netbird_ipv4.stdout | trim }}"

- name: Require a valid Netbird IPv4 address
  ansible.builtin.assert:
    that:
      - netbird_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: "Netbird did not report a valid mesh IPv4 address."

- name: Prove OpenSSH is reachable over Netbird
  ansible.builtin.wait_for:
    host: "{{ netbird_ip }}"
    port: 22
    connect_timeout: 5
    timeout: 60
  delegate_to: localhost
  become: false

# Cutover uses a new IP the operator has never SSHed to. Use plain (unhashed)
# keyscan lines so known_hosts name matches; skip ssh-keyscan comment lines.
# accept-new still covers first-seen keys; a changed key still fails.
- name: Fetch Netbird host keys for the operator machine
  ansible.builtin.command:
    cmd: ssh-keyscan -T 5 {{ netbird_ip }}
  register: netbird_operator_host_keys
  changed_when: false
  failed_when: >-
    netbird_operator_host_keys.rc != 0
    or (netbird_operator_host_keys.stdout_lines | reject('match', '^\\s*#') | list | length) == 0
  delegate_to: localhost
  become: false

- name: Trust Netbird host keys on the operator machine
  ansible.builtin.known_hosts:
    path: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
    name: "{{ netbird_ip }}"
    key: "{{ item }}"
    state: present
  loop: "{{ netbird_operator_host_keys.stdout_lines | reject('match', '^\\s*#') | list }}"
  loop_control:
    label: "{{ item.split()[1] | default('host-key') }}"
  delegate_to: localhost
  become: false

- name: Switch Ansible to Netbird SSH
  ansible.builtin.set_fact:
    ansible_host: "{{ netbird_ip }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

- name: Reset SSH connection for Netbird
  ansible.builtin.meta: reset_connection

- name: Prove Ansible key login over Netbird
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    sleep: 2
    timeout: 60
