---
- name: Require Ubuntu 24.04 LTS
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("24.04", "==")
    fail_msg: "The bootstrap roles support Ubuntu 24.04 LTS only."

- name: Install practical baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/60homeops-unattended-upgrades
    content: |
      APT::Periodic::Enable "1";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Enable systemd time synchronization
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Enable unattended upgrades service
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
