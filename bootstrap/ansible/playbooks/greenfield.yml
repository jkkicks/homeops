---
- name: Greenfield bootstrap new hosts
  hosts: new_nodes
  become: true
  serial: 1
  pre_tasks:
    - name: Require explicit cold-backup confirmation
      ansible.builtin.assert:
        that:
          - age_private_key_backup_confirmed | bool
        fail_msg: >-
          Set AGE_BACKUP_CONFIRMED=yes only after storing the age private key
          in a cold offline backup.
  roles:
    - role: bootstrap_user
      tags: [lockdown]
    - role: netbird
      tags: [lockdown, netbird]
    - role: ufw
      tags: [lockdown]
    - role: baseline
      tags: [lockdown]

- name: Install Docker on new hosts serially
  hosts: new_nodes
  become: true
  serial: 1
  roles:
    - role: docker
      tags: [docker]

- name: Initialize the first Swarm manager alone
  hosts: "{{ groups['managers'][0] }}"
  become: true
  serial: 1
  vars:
    swarm_action: init
    swarm_expected_role: manager
    swarm_init_host: "{{ groups['managers'][0] }}"
  roles:
    - role: swarm
      tags: [swarm]

- name: Join additional Swarm managers serially
  hosts: "managers:!{{ groups['managers'][0] }}"
  become: true
  serial: 1
  vars:
    swarm_action: join
    swarm_expected_role: manager
    swarm_init_host: "{{ groups['managers'][0] }}"
  roles:
    - role: swarm
      tags: [swarm]

- name: Join Swarm workers serially
  hosts: workers
  become: true
  serial: 1
  vars:
    swarm_action: join
    swarm_expected_role: worker
    swarm_init_host: "{{ groups['managers'][0] }}"
  roles:
    - role: swarm
      tags: [swarm]

- name: Bootstrap doco-cd on the init manager
  hosts: "{{ groups['managers'][0] }}"
  become: true
  serial: 1
  roles:
    - role: doco_cd
      tags: [doco_cd]

- name: Retain long-lived secrets and remove bootstrap plaintext
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  serial: 1
  tasks:
    - name: Encrypt and clean up operator secrets
      ansible.builtin.include_tasks: ../tasks/encrypt-and-cleanup.yml
      tags: [doco_cd, secrets]

- name: Verify greenfield completion contract
  hosts: all
  become: true
  serial: 1
  check_mode: true
  vars:
    ansible_host: "{{ netbird_ip }}"
    ansible_user: "{{ bootstrap_user_name }}"
    verify_scope: greenfield
  roles:
    - role: verify
      tags: [verify]
