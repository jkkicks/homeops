---
timezone: UTC
netbird_environment_group: homeops-operators
swarm_availability: active
swarm_labels: {}
age_private_key_backup_confirmed: false
verify_scope: greenfield
# Latest poll outcome is the health signal (see verify DOCO_CD_HEALTH).
doco_cd_verify_log_since: 15m

bootstrap_user_name: ansible
bootstrap_ssh_public_keys_dir: "{{ playbook_dir }}/../../../ssh-keys"
netbird_setup_key_file: "{{ playbook_dir }}/../../../netbird_setup_key.txt"
doco_cd_age_key_file: "{{ playbook_dir }}/../../../sops_age_key.txt"
doco_cd_git_token_file: "{{ playbook_dir }}/../../../git_access_token.txt"
doco_cd_git_token_sops_file: >-
  {{ playbook_dir }}/../secrets/git_access_token.sops.yml

baseline_packages:
  - ca-certificates
  - curl
  - gnupg
  - systemd-timesyncd
  - unattended-upgrades

docker_packages:
  - name: docker-ce
    version: "5:29.6.1-1~ubuntu.24.04~noble"
  - name: docker-ce-cli
    version: "5:29.6.1-1~ubuntu.24.04~noble"
  - name: containerd.io
    version: "2.2.5-1~ubuntu.24.04~noble"
  - name: docker-buildx-plugin
    version: "0.35.0-1~ubuntu.24.04~noble"
  - name: docker-compose-plugin
    version: "5.3.1-1~ubuntu.24.04~noble"
